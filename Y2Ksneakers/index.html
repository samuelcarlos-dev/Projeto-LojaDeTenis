<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Y2k.sneakers</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="pesquisa">
        <form>
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Pesquisar" />

            <button type="submit" class="btn">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </div>
      <div class="logo">
        <img
          src="assets/images/Logos/Logo_y2k_png2.0.png"
          alt="Logo Y2K Sneakers"
        />
      </div>

      <div class="usuario">
        <div class="carrinho">
          <a href="#">
            <i class="bi bi-cart3"></i>
          </a>
        </div>
        <a href="#" class="login">Login</a>
      </div>
    </header>

    <main>
      <section class="promocao">
          <img
          src="assets/images/Banners/Banner_Novidades .webp"
          alt="Banner de Promoção"
          />
        </section>

      <section class="marcas">
        <img src="assets/images/Logos/Logo_Adidas.webp" alt="Logo Adidas" />
        <img src="assets/images/Logos/Logo_Asics.webp" alt="Logo Asics" />
        <img src="assets/images/Logos/Logo_Nike.webp" alt="Logo Nike" />
        <img src="assets/images/Logos/Logo_Puma.webp" alt="Logo Puma" />
        <img
          src="assets/images/Logos/logo_NewBalance.webp"
          alt="Logo New Balance"
        />
      </section>
      <section class="sugestões">
        <img src="assets/images/Sugestões/AirMax95.webp" alt="Air Max 95" />
        <img src="assets/images/Sugestões/AirMaxTN.webp" alt="Air Max TN" />
        <img src="assets/images/Sugestões/NikeShox.webp" alt="Nike Shox" />
      </section>
    </main>

    <footer>
      <p>&copyY2K Sneakers.</p>
    </footer>
  </body>
</html>
