<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Y2k.sneakers</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="pesquisa">
        <input type="text" placeholder="Pesquisar..." />
        <button>🔍</button>
      </div>
      <div class="logo">
        <img
          src="assets/images/Logos/Logo_y2k_png2.0.png"
          alt="Logo Y2K Sneakers"
        />
      </div>

      <div class="usuario">
        <div class="carrinho">
          <span>🛒</span>
          <a href="#">Login</a>
        </div>
      </div>
    </header>

    <main>
      <section class="promocao">
        <img
          src="assets/images/Banners/Banner_Novidades .png"
          alt="Banner de Promoção"
        />
      </section>

      <section class="marcas">
        <img src="assets/images/Logos/Logo_Adidas.png" alt="Logo Adidas" />
        <img src="assets/images/Logos/Logo_Asics.png" alt="Logo Asics" />
        <img src="assets/images/Logos/Logo_Nike.png" alt="Logo Nike" />
        <img src="assets/images/Logos/Logo_Puma.png" alt="Logo Puma" />
        <img
          src="assets/images/Logos/logo_NewBalance.png"
          alt="Logo New Balance"
        />
      </section>
      <section class="produtos">
        <img src="assets/images/produtos/AirMax95.png" alt="Air Max 95" />
        <img src="assets/images/produtos/AirMaxTN.png" alt="Air Max TN" />
        <img src="assets/images/produtos/NikeShox.png" alt="Nike Shox" />
      </section>
    </main>

    <footer>
      <p>Y2K Sneakers.</p>
    </footer>
  </body>
</html>
