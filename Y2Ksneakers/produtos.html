<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Y2k.sneakers</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="pesquisa">
        <form>
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Pesquisar" />

            <button type="submit" class="btn">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </div>
      <div class="logo">
        <img
          src="assets/images/Logos/Logo_y2k_png2.0.png"
          alt="Logo Y2K Sneakers"
        />
      </div>

      <div class="usuario">
        <div class="carrinho">
          <a href="#">
            <i class="bi bi-cart3"></i>
          </a>
        </div>
        <a href="#" class="login">Login</a>
      </div>
    </header>
    <section class="produtos">
    <img src="assets/image/Produtos/AirMax96.webp" alt="Air Max 95" />
    <img src="assets/image/Produtos/AirMax96LEGO.webp" alt="Air Max 95 LEGO" />
    <img src="assets/image/Produtos/AirMaxDnBranco.webp" alt="Air Max Dn Branco" />
    <img src="assets/image/Produtos/AirMaxDnPreto.webp" alt="Air Max Dn Preto" />
    <img src="assets/image/Produtos/AirMaxDnPretoBranco.webp" alt="Air Max Dn Preto Branco" />
    <img src="assets/image/Produtos/AirMaxPlus.webp" alt="Air Max Plus" />
    <img src="assets/image/Produtos/AirMaxPlusLaranja" alt="Air Max Plus Laranja" />
    <img src="assets/image/Produtos/AsicsGelNYCAzul.webp" alt="Asics Gel NYC Azul" />
    <img src="assets/image/Produtos/AsicsGelNycCinza.webp" alt="Asics Gel NYC Cinza" />
    <img src="assets/image/Produtos/NikeP6000.webp" alt="Nike P6000" />
    <img src="assets/image/Produtos/NikeShoxTL.webp" alt="Nike Shox TL" />
    <img src="assets/image/Produtos/NikeShoxTLVerde.webp" alt="Nike Shox TL Verde" />
    <footer>
      <p>&copyY2K Sneakers.</p>
    </footer>
  </body>
</html>
