<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Cadastro de Usuário</h1>
    </header>

    <main>
        <form class="form">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required disabled>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="Digite seu CPF" required disabled>
            </div>

            <div class="form-group">
                <label for="nascimento">Nascimento:</label>
                <input type="date" id="nascimento" required disabled>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required disabled>
            </div>

            <button type="button" id="habilitar">Habilitar</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
